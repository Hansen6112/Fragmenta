<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fragmenta</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%A0%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <header id="app-header">
      <h1>FRAGMENTA</h1>
      <p class="subtitle">a world, shattered</p>
    </header>
    <main id="terminal">
      <div id="tab-bar" role="tablist">
        <button type="button" class="tab-btn active" data-tab="story" role="tab" aria-selected="true">Story</button>
        <button type="button" class="tab-btn" data-tab="inventory" role="tab" aria-selected="false">Inventory</button>
        <button type="button" class="tab-btn" data-tab="equipment" role="tab" aria-selected="false">Equipment</button>
      </div>
      <div id="log" aria-live="polite"></div>
      <div id="inventory-panel" hidden></div>
      <div id="equipment-panel" hidden></div>
      <form id="input-form" autocomplete="off">
        <span class="prompt">&gt;</span>
        <input id="input" type="text" autocomplete="off" autofocus placeholder="type a command, or just say what you want to do..." />
      </form>
    </main>
    <footer id="app-footer">
      <span>help</span> · <span>look</span> · <span>go &lt;place&gt;</span> · <span>map</span> · <span>lore</span> · <span>explore</span>
    </footer>
  </div>

  <script src="js/data/world.js"></script>
  <script src="js/data/bestiary.js"></script>
  <script src="js/data/backgrounds.js"></script>
  <script src="js/data/factions.js"></script>
  <script src="js/data/lexicon.js"></script>
  <script src="js/data/lore.js"></script>
  <script src="js/data/jobs.js"></script>
  <script src="js/data/tactics.js"></script>
  <script src="js/data/elements.js"></script>
  <script src="js/data/elementabilities.js"></script>
  <script src="js/data/synergy.js"></script>
  <script src="js/data/matchups.js"></script>
  <script src="js/data/enemymages.js"></script>
  <script src="js/engine/leveling.js"></script>
  <script src="js/engine/state.js"></script>
  <script src="js/engine/travel.js"></script>
  <script src="js/engine/combat.js"></script>
  <script src="js/engine/jobs.js"></script>
  <script src="js/engine/generator.js"></script>
  <script src="js/engine/parser.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
