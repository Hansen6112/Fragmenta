name: Codex snapshot
# On every push to the default branch, rebuild the codex data the nightly
# Codex Tracker reads, and store it on the codex-data branch.
on:
  push:
    branches-ignore: [codex-data]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: codex-snapshot
  cancel-in-progress: false
jobs:
  build:
    # Only the repo's default branch feeds the codex.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: game
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check out codex-data branch (create if missing)
        run: |
          cd game
          if git ls-remote --exit-code --heads origin codex-data >/dev/null; then
            git worktree add ../data codex-data
          else
            git worktree add --orphan -b codex-data ../data
          fi
      - name: Build codex data
        run: bash game/tools/codex/build.sh game data
      - name: Commit codex data
        run: |
          cd data
          git config user.name "codex-snapshot[bot]"
          git config user.email "codex-snapshot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Codex data for ${GITHUB_SHA::7}"
          git push origin codex-data
